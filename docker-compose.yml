# Anil3 fraud platformu
#   docker compose up --build            -> http://localhost:8000 (API_PORT ile değişir; prod modu)
#   docker compose --profile observability up   (+ Prometheus :9090, Grafana :3000; PROMETHEUS_PORT / GRAFANA_PORT)
#
# Varsayılan ENVIRONMENT=prod: başlangıç politikası (app/security/startup.py)
# demo sırlarıyla açılmayı reddeder. JWT_SECRET, AUDIT_HMAC_KEY ve
# CONSORTIUM_SALT zorunludur (boşsa compose durur). Yerel demo için dev
# moduna açıkça geçin:
#   ENVIRONMENT=dev SEED_DEMO_USERS=true docker compose up --build
# .env (opsiyonel) env_file ile verilir, imaja kopyalanmaz. Postgres parolası
# yalnızca yerel demo içindir; üretimde secret yönetimiyle değiştirilir.
name: anil3

x-app: &app
  build: .
  image: anil3-fraud:latest
  env_file:
    - path: .env
      required: false
  environment: &app-env
    # prod varsayılan; yerel demo için ENVIRONMENT=dev (bkz. README)
    ENVIRONMENT: ${ENVIRONMENT:-prod}
    DATABASE_URL: postgresql+asyncpg://fraud:fraud@postgres:5432/fraud
    REDIS_URL: redis://redis:6379/0
    EVENT_BUS: redis
    # /metrics requires "Authorization: Bearer $METRICS_TOKEN"; Prometheus reads
    # the same value from ops/prometheus/metrics_token (git-ignored, see README)
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    # Zorunlu: tüm süreçler aynı imza anahtarını paylaşır (boşsa compose durur).
    # Üretmek için: python -c "import secrets; print(secrets.token_urlsafe(48))"
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET tanımlayın (.env veya ortam değişkeni)}
    # Zorunlu: denetim zincirinin HMAC anahtarı (>= 32 karakter, rastgele)
    AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY tanımlayın (.env veya ortam değişkeni)}
    # Zorunlu: konsorsiyum müşteri özetlerinin tuzu (repodaki demo tuzu prod'da reddedilir)
    CONSORTIUM_SALT: ${CONSORTIUM_SALT:?CONSORTIUM_SALT tanımlayın (.env veya ortam değişkeni)}
    # hız sınırı sayaçları Redis'te (prod'da memory:// reddedilir)
    RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
    # Demo kullanıcıları (bilinen parolalar) yalnızca açıkça istenirse:
    #   ENVIRONMENT=dev SEED_DEMO_USERS=true docker compose up (prod reddeder)
    SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
    # Kişisel hesaplar: scripts/create_user.py ile üretilen dosya, imaja bağlanmış
    # olarak (ör. volumes: ./users.json:/run/users.json:ro, USERS_FILE=/run/users.json)
    USERS_FILE: ${USERS_FILE:-}
    FEATURE_STORE: redis
    DB_AUTO_CREATE: "false"
    LOG_JSON: "true"
    # Demo nüfusu: 150 sentetik müşteri (IBAN, CoP kaydı) + ısınma geçmişi
    FRAUD_CUSTOMERS_PATH: /app/data/demo/customers.json
    FRAUD_PAYEES_PATH: /app/data/demo/payees.json
    FRAUD_TRANSACTIONS_PATH: /app/data/demo/transactions.json
    BATCH_REBASE_TS: "true"
    BUS_PARTITIONS: "8"  # müşteri bazlı sıralı, bölümler arası paralel
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *app-env
      STREAM_MODE: ${STREAM_MODE:-batch}
      # uvicorn --workers (V6): idempotency claims, SSE tickets, warm-up
      # leadership and the rate limiter are shared through Redis
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      - fraud-var:/app/var
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    # audit-chain verification metrics for Prometheus (METRICS_TOKEN protected)
    expose:
      - "9102"
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Sürekli canlı trafik (Redis Streams ingress). Kapatmak için:
  #   docker compose up --scale simulator=0
  simulator:
    <<: *app
    command:
      - python
      - -m
      - app.simulator
      - --rate
      - "${SIM_RATE:-2}"
      - --anomaly-rate
      - "${SIM_ANOMALY_RATE:-0.02}"
      - --scenario-every
      - "${SIM_SCENARIO_EVERY:-180}"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  # --- opsiyonel gözlemlenebilirlik profili ---------------------------------
  #   docker compose --profile observability up
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./ops/prometheus/metrics_token:/etc/prometheus/metrics_token:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      # anonim erişim kapalı: panolar işlem hacmi ve karar dağılımını gösterir
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # yönetici parolası git'e girmeyen dosyadan (bkz. README)
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_DEFAULT_LANGUAGE: tr-TR
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./ops/grafana/admin_password:/run/secrets/grafana_admin_password:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  fraud-var:
