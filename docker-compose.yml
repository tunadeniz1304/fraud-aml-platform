# docker compose up --build  ->  http://localhost:8000
# .env (opsiyonel) env_file ile verilir; imaja kopyalanmaz.
name: anil3

services:
  api:
    build: .
    image: anil3-fraud:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      STREAM_MODE: ${STREAM_MODE:-stream}
      STREAM_RATE: ${STREAM_RATE:-2}
      LOG_JSON: ${LOG_JSON:-true}
    volumes:
      - fraud-var:/app/var
    restart: unless-stopped

volumes:
  fraud-var:
