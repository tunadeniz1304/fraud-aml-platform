name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Tests (random order) + coverage (>= 90%)
        run: python -m pytest -q -p randomly --timeout 900 --cov=app --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Component tests (Vitest)
        run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    env:
      E2E_BASE_URL: http://localhost:8010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
      - name: Build dashboard
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          FRAUD_DB_PATH="$RUNNER_TEMP/e2e.db" STREAM_MODE=batch LLM_MODE=demo VECTOR_STORE=off           FRAUD_CUSTOMERS_PATH=data/demo/customers.json FRAUD_PAYEES_PATH=data/demo/payees.json           FRAUD_TRANSACTIONS_PATH=data/demo/transactions.json FRONTEND_DIST="$PWD/frontend/dist"           nohup python -m uvicorn server:app --port 8010 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 90); do curl -fs http://localhost:8010/api/health/live && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Playwright E2E
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
