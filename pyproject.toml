[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anil3-fraud-platform"
version = "2.0.0"
description = "Gerçek zamanlı, hibrit skorlu bankacılık fraud & AML platformu (kural + ML + graf + APP + LLM copilot)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "tunadeniz1304" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0.1",
    "openai>=1.50",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pyod>=2.0",
    "shap>=0.46",
    "river>=0.21",
    "networkx>=3.3",
    "rapidfuzz>=3.9",
    "simpleeval>=1.0",
    "pyyaml>=6.0",
    "pyjwt>=2.9",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "reportlab>=4.2",
    "holidays>=0.57",
    "chromadb>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "fakeredis>=2.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]
anthropic = ["anthropic>=0.34"]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
load = ["locust>=2.31"]
federated = ["flwr>=1.11"]
gnn = ["torch>=2.3", "torch_geometric>=2.5"]

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "data", "models", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "BLE"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Türkçe metinlerde 'ı', 'İ' vb. bilinçli
    "S101",                        # testlerde assert
    "S311",                        # simülasyon RNG'si kriptografik değil
    "B008",                        # FastAPI Depends() varsayılanları
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "SIM", "BLE"]
"scripts/**" = ["S", "E402"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["frontend/", "alembic/versions/"]

[[tool.mypy.overrides]]
# hot path and money/state handling: every function must be annotated
module = ["app.scoring.*", "app.features.*", "app.bus.*", "app.cases.*"]
disallow_untyped_defs = true

# --------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: uzun süren testler (eğitim, 10k replay)",
    "benchmark: gecikme ölçüm testleri",
    "external_data: tam halka açık veri seti gerektirir (yoksa atlanır)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["app"]
branch = false
omit = ["app/graph/gnn.py"]

[tool.coverage.report]
show_missing = false
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
